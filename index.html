<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가계부</title>
<meta name="description" content="결제 직후 몇 초 만에 지출과 수입을 적고, 달마다 어디에 썼는지 보는 개인 가계부.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* 디자인: 아이폰 건강 앱 톤. 회색 바탕 위 흰 요약 타일, 타일 제목은 색으로 구분, 숫자는 굵게 크게.
 * 색 = 정보: 분홍은 저장·선택, 초록은 수입, 남색은 저축, 카테고리마다 고유색. */
@import url("./tokens.css");
@import url("./base.css");

:root { --tab-h: 62px; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px); }
html, body { min-height: 100%; }
body { line-height: 1.4; font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { color: inherit; }
button { cursor: pointer; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

#view { max-width: var(--container); margin-inline: auto; padding: calc(var(--safe-t) + var(--space-sm)) var(--space-md) calc(var(--tab-h) + var(--safe-b) + var(--space-2xl)); }

/* 큰 제목 */
.navbar { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-sm); padding: var(--space-2xs) 0 var(--space-md); }
.navbar h1 { font: 700 var(--text-display)/1.15 var(--font-display); letter-spacing: 0.01em; }
.navbar .actions { display: flex; gap: var(--space-xs); }
.round { width: 34px; height: 34px; border: 0; border-radius: var(--radius-pill); background: var(--color-paper-2); color: var(--color-accent-text); display: grid; place-items: center; position: relative; box-shadow: var(--shadow-card); transition: background-color var(--dur-micro) var(--ease-out); }
.round svg { width: 16px; height: 16px; }
.round::after { content: ""; position: absolute; inset: -5px; }
.round:hover { background: var(--color-paper-3); }
.round:active { opacity: 0.6; }

/* 세그먼트 */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--color-paper-3); border-radius: var(--radius-control); padding: var(--space-3xs); }
.seg button { border: 0; background: none; min-height: 30px; border-radius: 7px; font: 600 var(--text-sub)/1 var(--font-body); color: var(--color-ink); transition: background-color var(--dur-short) var(--ease-out); }
.seg button:hover { background: var(--color-rule); }
.seg button:active { opacity: 0.7; }
.seg button[aria-pressed="true"] { background: var(--color-paper-2); box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }

/* 타일 = 건강 앱 요약 카드 */
.tile { background: var(--color-paper-2); border-radius: var(--radius-card); padding: var(--space-sm) var(--space-md); }
.tile + .tile { margin-top: var(--space-xs); }
.thead { display: flex; justify-content: space-between; align-items: center; gap: var(--space-sm); font-size: var(--text-sub); }
.thead .ttl { font-weight: 700; color: var(--tt, var(--color-ink)); display: flex; align-items: center; gap: 6px; }
.thead .ttl .ico { width: 18px; height: 18px; border-radius: 5px; font-size: 11px; }
.thead .meta { color: var(--color-muted); font-size: var(--text-sm); white-space: nowrap; }
.tbody { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--space-sm); margin-top: var(--space-xs); }
.fig { font: 700 var(--text-tile)/1 var(--font-display); letter-spacing: -0.01em; white-space: nowrap; }
.fig small { font-size: var(--text-sub); font-weight: 600; color: var(--color-muted); margin-left: 3px; letter-spacing: 0; }
.tnote { font-size: var(--text-sm); color: var(--color-muted); margin-top: var(--space-xs); }
.tnote b { font-weight: 600; }
.tnote b.up { color: var(--color-danger); } .tnote b.down { color: var(--color-income); }
.tt-pink { --tt: var(--color-accent-text); } .tt-green { --tt: var(--color-income); } .tt-indigo { --tt: var(--color-saving); }

/* 그룹 목록 (내역·설정) */
.group { background: var(--color-paper-2); border-radius: var(--radius-card); overflow: hidden; }
.ghead { font-size: var(--text-sm); color: var(--color-muted); padding: 0 var(--space-md) var(--space-xs); margin-top: var(--space-lg); display: flex; justify-content: space-between; gap: var(--space-sm); }
.ghead span:first-child { font-weight: 700; color: var(--color-ink); font-size: var(--text-sub); white-space: nowrap; flex-shrink: 0; }
.ghead span:last-child { text-align: right; }
.gfoot { font-size: var(--text-sm); color: var(--color-muted); padding: var(--space-xs) var(--space-md) 0; }
.row { display: flex; align-items: center; gap: var(--space-sm); min-height: 44px; padding: var(--space-xs) var(--space-md); position: relative; width: 100%; border: 0; background: none; text-align: left; }
.row + .row::before { content: ""; position: absolute; top: 0; left: var(--space-md); right: 0; border-top: var(--rule-hair) solid var(--color-rule); }
.row.inset + .row.inset::before { left: calc(var(--space-md) + 32px + var(--space-sm)); }
button.row { transition: background-color var(--dur-micro) var(--ease-out); }
button.row:hover { background: var(--color-paper); }
button.row:active { background: var(--color-paper-3); }
.row .grow { flex: 1; min-width: 0; }
.row .t { display: block; font-size: var(--text-md); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { display: block; font-size: var(--text-sm); color: var(--color-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .val { font-size: var(--text-md); white-space: nowrap; }
.row .chev { width: 14px; height: 14px; color: var(--color-field-edge); flex-shrink: 0; }
.row.action { color: var(--color-accent-text); font-size: var(--text-md); }

/* 카테고리 아이콘: 건강 앱의 둥근 사각 색 아이콘 */
.ico { flex-shrink: 0; width: 32px; height: 32px; border-radius: var(--radius-icon); display: grid; place-items: center; background: var(--color-accent-soft); color: var(--color-accent-text); }
.ico svg { width: 19px; height: 19px; stroke-width: 2; }
.ico.big { width: 40px; height: 40px; border-radius: 11px; }
.ico.big svg { width: 23px; height: 23px; }
.tint-0 { --ic: var(--tint-0); --tc: var(--tint-0-text); } .tint-1 { --ic: var(--tint-1); --tc: var(--tint-1-text); }
.tint-2 { --ic: var(--tint-2); --tc: var(--tint-2-text); } .tint-3 { --ic: var(--tint-3); --tc: var(--tint-3-text); }
.tint-4 { --ic: var(--tint-4); --tc: var(--tint-4-text); } .tint-5 { --ic: var(--tint-5); --tc: var(--tint-5-text); }
.tint-6 { --ic: var(--tint-6); --tc: var(--tint-6-text); } .tint-7 { --ic: var(--tint-7); --tc: var(--tint-7-text); }
.tint-8 { --ic: var(--tint-8); --tc: var(--tint-8-text); } .tint-9 { --ic: var(--tint-9); --tc: var(--tint-9-text); }
.tint-10 { --ic: var(--tint-10); --tc: var(--tint-10-text); } .tint-11 { --ic: var(--tint-11); --tc: var(--tint-11-text); }

/* 입력: 금액 타일 */
.amt-tile { margin-top: var(--space-sm); padding-bottom: var(--space-sm); }
.form[data-type="expense"] .amt-tile { --tt: var(--color-accent-text); }
.form[data-type="income"] .amt-tile { --tt: var(--color-income); }
.amount { display: flex; align-items: baseline; gap: var(--space-2xs); margin-top: var(--space-xs); cursor: text; }
.amount input { border: 0; background: none; padding: 0; min-width: 1ch; max-width: 100%; font: 700 var(--text-figure)/1.05 var(--font-display); letter-spacing: -0.02em; color: var(--color-ink); caret-color: var(--color-accent); box-shadow: 0 2px 0 var(--color-rule); }
.amount input:focus-visible { outline: 2px solid transparent; box-shadow: 0 2px 0 var(--tt); }
.amount input::placeholder { color: var(--color-field-edge); }
.amount .won { font: 600 var(--text-lg)/1 var(--font-display); color: var(--color-muted); }
.label { font: 700 var(--text-md)/1.2 var(--font-display); color: var(--color-ink); padding: 0 var(--space-2xs) var(--space-xs); margin-top: var(--space-lg); }
.form .label { font-size: var(--text-sub); margin-top: var(--space-sm); padding-bottom: 6px; }

/* 카테고리 격자: 작은 흰 타일 */
.cats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.cat { border: 0; background: var(--color-paper-2); border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px var(--space-3xs) 6px; font-size: var(--text-sm); font-weight: 500; line-height: 1.2; color: var(--color-ink); word-break: keep-all; text-align: center; box-shadow: var(--shadow-card); transition: transform var(--dur-micro) var(--ease-out); }
.cat:hover { background: var(--color-paper); }
.cat:active { transform: scale(0.96); }
.cat[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--color-accent); font-weight: 700; }
.cat[aria-pressed="true"] .ico { background: var(--color-accent); color: var(--color-accent-ink); }
.form[data-type="income"] .ico { background: var(--color-income-soft); color: var(--color-income); }
.form[data-type="saving"] .ico { background: var(--color-saving-soft); color: var(--color-saving); }
.form[data-type="saving"] .cat[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--color-saving-fill); }
.form[data-type="saving"] .cat[aria-pressed="true"] .ico { background: var(--color-saving-fill); color: #FFFFFF; }
.form[data-type="saving"] .amt-tile { --tt: var(--color-saving); }
.form[data-type="saving"] .chip[aria-pressed="true"] { background: var(--color-saving-fill); }
.form[data-type="saving"] .btn:not(.plain) { background: var(--color-saving-fill); }
.form[data-type="income"] .cat[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--color-income-fill); }
.form[data-type="income"] .cat[aria-pressed="true"] .ico { background: var(--color-income-fill); color: #FFFFFF; }

/* 결제수단 캡슐 */
.chips { display: flex; flex-wrap: wrap; gap: var(--space-xs); }
.chip { border: 0; border-radius: var(--radius-pill); background: var(--color-paper-2); min-height: 34px; padding: 0 14px; font-size: var(--text-sub); font-weight: 500; color: var(--color-ink); box-shadow: var(--shadow-card); transition: background-color var(--dur-micro) var(--ease-out); }
.chip:hover { background: var(--color-paper-3); }
.chip:active { opacity: 0.7; }
.chip[aria-pressed="true"] { background: var(--color-accent); color: var(--color-accent-ink); font-weight: 600; }
.form[data-type="income"] .chip[aria-pressed="true"] { background: var(--color-income-fill); }

/* 입력칸 */
.field { width: 100%; min-height: 36px; border: 0; border-radius: var(--radius-control); background: var(--color-paper-2); box-shadow: inset 0 0 0 1px var(--color-field-edge); padding: var(--space-xs) var(--space-sm); font-size: var(--text-md); color: var(--color-ink); }
.field::placeholder { color: var(--color-muted); }
.field:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 0; }
.row .field.plain { background: none; box-shadow: inset 0 -1px 0 var(--color-field-edge); border-radius: 0; padding: var(--space-2xs) 0; min-height: 32px; }
.row .field.plain:focus-visible { outline-offset: 4px; }
.pill-date { border: 0; border-radius: 7px; background: var(--color-paper-3); padding: var(--space-2xs) var(--space-sm); font-size: var(--text-md); color: var(--color-ink); min-height: 34px; box-shadow: inset 0 0 0 1px var(--color-field-edge); -webkit-appearance: none; appearance: none; }
.pill-date:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 0; }
/* iOS 스위치 */
.switch { -webkit-appearance: none; appearance: none; position: relative; flex-shrink: 0; margin: 0; width: 51px; height: 31px; border-radius: var(--radius-pill); background: var(--color-paper-3); box-shadow: inset 0 0 0 1px var(--color-field-edge); cursor: pointer; transition: background-color var(--dur-short) var(--ease-out); }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 4px rgb(0 0 0 / 0.2); transition: transform var(--dur-short) var(--ease-out); }
.switch:checked { background: var(--color-saving-fill); box-shadow: none; }
.switch:checked::after { transform: translateX(20px); }
.switch:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
textarea.field { min-height: 11rem; line-height: 1.6; resize: vertical; border-radius: var(--radius-card); }
.err { color: var(--color-error); font-size: var(--text-sm); min-height: 1lh; margin: var(--space-3xs) var(--space-2xs) 0; }

/* 버튼 */
.btn { border: 0; border-radius: var(--radius-card); width: 100%; min-height: 50px; padding: 0 var(--space-md); font: 600 var(--text-md)/1 var(--font-body); white-space: nowrap; background: var(--color-accent); color: var(--color-accent-ink); transition: opacity var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out); }
.form[data-type="income"] .btn:not(.plain) { background: var(--color-income-fill); }
.btn:hover { opacity: 0.9; }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn.plain { background: var(--color-paper-2); color: var(--color-danger); }
.btn + .btn { margin-top: var(--space-sm); }
.textbtn { border: 0; background: none; color: var(--color-accent-text); font-size: var(--text-md); padding: var(--space-2xs) var(--space-3xs); border-radius: 6px; white-space: nowrap; }
.textbtn:hover { background: var(--color-paper-3); }
.textbtn:active { opacity: 0.6; }
.textbtn.danger { color: var(--color-danger); }
.mini { border: 0; border-radius: var(--radius-pill); background: var(--color-paper-3); color: var(--color-ink-2); width: 30px; height: 30px; display: grid; place-items: center; flex-shrink: 0; position: relative; }
.mini svg { width: 13px; height: 13px; }
.mini::after { content: ""; position: absolute; inset: -6px; }
.mini:hover { background: var(--color-rule); }
.mini:active { opacity: 0.6; }
.mini:disabled { opacity: 0.4; cursor: not-allowed; }

.note { display: flex; align-items: center; gap: var(--space-sm); margin-bottom: var(--space-sm); font-size: var(--text-sub); }
.note p { flex: 1; color: var(--color-ink-2); }

.search { position: relative; margin-bottom: var(--space-sm); }
.search .field { padding-left: 36px; background: var(--color-paper-3); box-shadow: none; }
.search svg { position: absolute; left: var(--space-sm); top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--color-muted); }

.amt { font-size: var(--text-md); font-weight: 600; white-space: nowrap; color: var(--color-ink); }
.amt.income { color: var(--color-income); } .amt.saving { color: var(--color-saving); } .amt.out { color: var(--color-muted); }
.badge-repeat { font-size: var(--text-xs); color: var(--color-muted); margin-left: var(--space-2xs); }
.empty { padding: var(--space-xl) var(--space-md); text-align: center; color: var(--color-muted); font-size: var(--text-sub); }
.empty strong { display: block; color: var(--color-ink); font-size: var(--text-md); margin-bottom: var(--space-2xs); }

/* 달력 */
.calwrap { padding: var(--space-sm) var(--space-xs) var(--space-xs); margin-top: var(--space-sm); }
.calhead { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); font-size: var(--text-xs); color: var(--color-muted); text-align: center; padding-bottom: var(--space-xs); }
.calhead .sun { color: var(--color-danger); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: var(--space-2xs); }
.cell { border: 0; background: none; border-radius: var(--radius-icon); min-height: 54px; padding: var(--space-2xs) 0; display: flex; flex-direction: column; align-items: center; gap: var(--space-3xs); color: var(--color-ink); transition: background-color var(--dur-micro) var(--ease-out); }
.cell:hover { background: var(--color-paper); }
.cell:active { background: var(--color-paper-3); }
.cell .n { width: 30px; height: 30px; border-radius: var(--radius-pill); display: grid; place-items: center; font-size: var(--text-sub); }
.cell .v { font-size: var(--text-xs); color: var(--color-muted); letter-spacing: -0.02em; }
.cell .v.zero { color: var(--color-income); font-weight: 600; }
.cell.future { color: var(--color-field-edge); }
.cell.today .n { color: var(--color-accent-text); font-weight: 700; }
.cell.sel .n { background: var(--color-accent); color: var(--color-accent-ink); font-weight: 700; }
.cell.blank { visibility: hidden; }

/* 통계 */
.weekbars { display: flex; align-items: flex-end; gap: 5px; height: 40px; }
.weekbars i { width: 10px; min-height: 3px; border-radius: 3px; background: var(--color-accent); opacity: 0.3; }
.weekbars i.now { opacity: 1; }
.prog { width: 112px; height: 8px; border-radius: 4px; background: var(--color-paper-3); overflow: hidden; flex-shrink: 0; margin-bottom: 6px; }
.prog i { display: block; height: 100%; border-radius: 4px; background: var(--color-saving); transform-origin: left center; }
.split { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-sm); margin-top: var(--space-sm); padding-top: var(--space-sm); border-top: var(--rule-hair) solid var(--color-rule); }
.split .k { font-size: var(--text-xs); color: var(--color-muted); }
.split .v { font-size: var(--text-sub); font-weight: 600; margin-top: 2px; white-space: nowrap; }
.split .v.income { color: var(--color-income); } .split .v.saving { color: var(--color-saving); }
.catlist { margin-top: var(--space-xs); }
.catrow { padding: var(--space-xs) 0; }
.catrow + .catrow { border-top: var(--rule-hair) solid var(--color-rule); }
.catrow .top { display: flex; align-items: center; gap: var(--space-sm); }
.catrow .nm { flex: 1; min-width: 0; font-size: var(--text-md); }
.catrow .v { font-size: var(--text-md); font-weight: 600; white-space: nowrap; }
.catrow .pct { font-size: var(--text-sm); color: var(--color-muted); margin-left: var(--space-2xs); font-weight: 400; display: inline-block; min-width: 2.6em; text-align: right; }
.catrow .track { height: 6px; border-radius: 3px; background: var(--color-paper-3); margin: 6px 0 0 calc(32px + var(--space-sm)); overflow: hidden; }
.catrow .fill { height: 100%; border-radius: 3px; background: var(--color-accent); transform-origin: left center; }
.cmprow { display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-xs) 0; }
.cmprow + .cmprow { border-top: var(--rule-hair) solid var(--color-rule); }
.cmprow .nm { flex: 1; min-width: 0; }
.cmprow .nm .s { display: block; font-size: var(--text-sm); color: var(--color-muted); }
.diff { font-size: var(--text-sub); font-weight: 600; min-width: 4.5rem; text-align: right; }
.diff.up { color: var(--color-danger); } .diff.down { color: var(--color-income); } .diff.save { color: var(--color-saving); } .diff.none { color: var(--color-muted); font-weight: 400; }

/* 아이콘 고르기 */
.icongrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--space-xs); }
.iconpick { border: 0; background: var(--color-paper-2); border-radius: 10px; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: var(--text-xs); color: var(--color-ink-2); box-shadow: var(--shadow-card); }
.iconpick svg { width: 24px; height: 24px; }
.iconpick:hover { background: var(--color-paper); }
.iconpick:active { opacity: 0.7; }
.iconpick[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--color-accent-text); color: var(--color-accent-text); font-weight: 600; }
button.ico { border: 0; cursor: pointer; }
button.ico:hover { background: var(--color-rule); }
button.ico:active { opacity: 0.6; }

/* 시트 */
.backdrop { position: fixed; inset: 0; background: var(--color-scrim); z-index: var(--z-modal); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--color-paper); width: 100%; max-width: var(--container); max-height: 94dvh; overflow-y: auto; border-radius: 14px 14px 0 0; padding: 0 var(--space-md) calc(var(--safe-b) + var(--space-lg)); animation: sheet-in var(--dur-long) var(--ease-out); }
@keyframes sheet-in { from { transform: translateY(var(--space-2xl)); opacity: 0.6; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .btn:active, .cat:active { transform: none; } }
.sheethead { position: sticky; top: 0; z-index: var(--z-raised); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: var(--space-sm) 0; background: var(--color-paper); }

function sortRecords() {
  S.records.sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || '').localeCompare(a.createdAt || ''));
}

/* ---------- 반복 거래 ---------- */
async function runRecurring() {
  const t = today();
  const added = [];
  for (const r of S.settings.recurring) {
    if (!r.active) continue;
    let mk = monthKey(r.lastRun || r.startDate);
    while (mk <= monthKey(t)) {
      const [y, m] = mk.split('-').map(Number);
      const occ = `${mk}-${pad(Math.min(r.day, daysIn(y, m)))}`;
      const exists = S.records.some(x => x.recurringId === r.id && x.date === occ) || added.some(x => x.recurringId === r.id && x.date === occ);
      if (occ >= r.startDate && (!r.lastRun || occ > r.lastRun) && occ <= t && !exists) {
        added.push({
          id: uid(), type: r.type, date: occ, amount: r.amount, categoryId: r.categoryId,
          methodId: r.type === 'saving' ? null : r.methodId, memo: r.memo, recurringId: r.id, createdAt: new Date().toISOString(),
          ...(r.type === 'saving' ? { dir: r.dir || 'in' } : {})
        });
      }
      mk = addMonth(mk, 1);
    }
    r.lastRun = t;
  }
  if (added.length) { await dbPutMany(added); S.records.push(...added); sortRecords(); }
  await saveSettings();
  return added.length;
}

/* ---------- 집계 ---------- */
function monthRecords(mk) { return S.records.filter(r => monthKey(r.date) === mk); }
function sums(recs) {
  // saving = 순저축 (넣은 돈 − 꺼낸 돈)
  let income = 0, spend = 0, savIn = 0, savOut = 0;
  for (const r of recs) {
    if (r.type === 'income') income += r.amount;
    else if (isSaving(r)) { if (r.dir === 'out') savOut += r.amount; else savIn += r.amount; }
    else spend += r.amount;
  }
  return { income, spend, savIn, savOut, saving: savIn - savOut };
}
const signedWon = n => (n < 0 ? '−' : '') + won(Math.abs(n)) + '원';
const netSaving = rs => rs.reduce((a, r) => a + (r.dir === 'out' ? -r.amount : r.amount), 0);
// 저축 계좌의 '지금까지 넣은 돈'. 표시를 끈 계좌는 null.
// 앱 쓰기 전 납입액 { amount, until:'YYYY-MM' }이 있으면 그 금액에 until 다음 달부터의 기록만 더함 (겹치지 않게)
function accountTotal(id, monthEnd) {
  const c = cat(id);
  if (c?.showTotal === false) return null;
  const base = c?.base;
  const mine = S.records.filter(r => isSaving(r) && r.categoryId === id && r.date <= monthEnd);
  if (!base) return netSaving(mine);
  if (monthKey(monthEnd) < base.until) return null; // 기준 달보다 앞선 달은 합계를 알 수 없어서 표시하지 않음
  return base.amount + netSaving(mine.filter(r => monthKey(r.date) > base.until));
}
function byCategory(recs) {
  const m = new Map();
  for (const r of recs) if (r.type === 'expense' && !isSaving(r)) m.set(r.categoryId, (m.get(r.categoryId) || 0) + r.amount);
  return m;
}

function newDraft(type = 'expense', keep = {}) {
  return {
    type, amount: 0, categoryId: type === 'saving' ? defaultSavingAccount() : null, memo: '',
    methodId: type === 'saving' ? null : (keep.methodId ?? defaultMethod(type)),
    dir: 'in',
    date: keep.date ?? today()
  };
}
function defaultSavingAccount() {
  const act = activeCats('saving');
  return act.find(c => c.id === S.settings.lastSavingAccount)?.id ?? null;
}
const amountTitle = f => f.type === 'expense' ? '쓴 금액' : f.type === 'income' ? '받은 금액' : (f.dir === 'out' ? '꺼낸 금액' : '넣은 금액');
function defaultMethod(type) {
  const last = S.settings.lastMethod[type];
  const act = activeMethods(type);
  return act.find(m => m.id === last)?.id ?? act[0]?.id ?? null;
}
const measureCtx = document.createElement('canvas').getContext('2d');
function sizeAmount(input) {
  // 실제 글꼴로 숫자 폭을 재서 입력칸을 딱 맞춤 (원 글자가 숫자에 붙도록)
  const fit = () => {
    const cs = getComputedStyle(input);
    measureCtx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const ls = parseFloat(cs.letterSpacing) || 0;
    const text = input.value || input.placeholder;
    input.style.width = Math.ceil(measureCtx.measureText(text).width + ls * text.length + 4) + 'px';
  };
  if (input.isConnected) fit(); else requestAnimationFrame(fit);
}

    wrap.replaceChildren(...[

/* ---------- 화면: 입력 ---------- */
function backupDue() {
  if (!S.records.length) return false;
  const ref = S.settings.lastBackup || S.settings.firstUse;
  return (Date.now() - new Date(ref).getTime()) / 864e5 >= 14;
}
const isStandalone = () => window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;

function viewInput() {
  if (!UI.draft) UI.draft = newDraft();
  const notes = [];
  if (!isStandalone() && !S.settings.installHintDismissed) {
    notes.push(h('div', { class: 'group note' },
      h('p', {}, 'Safari 공유 버튼에서 "홈 화면에 추가"로 설치해서 써 주세요. Safari 탭과 홈 화면 앱은 기록이 따로 저장돼요.'),
      h('button', { class: 'textbtn', onclick: async () => { S.settings.installHintDismissed = true; await saveSettings(); render(); } }, '닫기')));
  }
  if (backupDue()) {
    const days = Math.floor((Date.now() - new Date(S.settings.lastBackup || S.settings.firstUse).getTime()) / 864e5);
    notes.push(h('div', { class: 'group note' },
      h('p', {}, S.settings.lastBackup ? `마지막 백업이 ${days}일 전이에요.` : '아직 백업한 적이 없어요.'),
      h('button', { class: 'textbtn', onclick: () => go('settings') }, '백업하기')));
  }
  return h('section', {},
    h('h1', { class: 'sr-only' }, '기록 입력'),
    notes,
    recordForm(UI.draft, {
      submitLabel: '저장',
      onSubmit: async f => {
        const rec = {
          id: uid(), type: f.type, date: f.date, amount: f.amount, categoryId: f.categoryId,
          methodId: f.type === 'saving' ? null : f.methodId, memo: f.memo.trim(), createdAt: new Date().toISOString(),
          ...(f.type === 'saving' ? { dir: f.dir || 'in' } : {})
        };
        await dbPut(rec);
        S.records.push(rec); sortRecords();
        if (f.type === 'saving') S.settings.lastSavingAccount = f.categoryId;
        else S.settings.lastMethod[f.type] = f.methodId;
        await saveSettings();
        UI.draft = newDraft(f.type, { methodId: f.methodId });
        if (document.activeElement) document.activeElement.blur();
        render();
        toast(`${won(rec.amount)}원 저장했어요`);
      }
    })
  );
}

/* ---------- 시트 ---------- */
function openSheet(title, body) {
  const close = () => { bd.remove(); document.body.style.overflow = ''; };
  const bd = h('div', { class: 'backdrop', onclick: e => { if (e.target === bd) close(); } },
    h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
      h('div', { class: 'sheethead' }, h('h2', {}, title), h('button', { class: 'textbtn', onclick: close }, '닫기')),
      body));
  document.body.append(bd);
  document.body.style.overflow = 'hidden';
  return close;
}

function editRecord(rec) {
  const f = { ...rec };
  let close;
  const form = recordForm(f, {
    submitLabel: '수정 저장',
    onSubmit: async f2 => {
      const upd = { ...rec, type: f2.type, date: f2.date, amount: f2.amount, categoryId: f2.categoryId, methodId: f2.type === 'saving' ? null : f2.methodId, memo: (f2.memo || '').trim() };
      if (f2.type === 'saving') upd.dir = f2.dir || 'in'; else delete upd.dir;
      await dbPut(upd);
      Object.assign(rec, upd); sortRecords();
      close(); render(); toast('수정했어요');
    },
    onDelete: async () => {
      if (!confirm(`${dateLabel(rec.date)} ${catName(rec.categoryId)} ${won(rec.amount)}원 기록을 삭제할까요?`)) return;
      await dbDel(rec.id);
      S.records = S.records.filter(r => r.id !== rec.id);
      close(); render(); toast('삭제했어요');
    }
  });
  close = openSheet('기록 수정', form);
}

function groupedList(recs, withYear) {
  const groups = new Map();
  for (const r of recs) { if (!groups.has(r.date)) groups.set(r.date, []); groups.get(r.date).push(r); }
  return [...groups].map(([d, rs]) => {
    const sp = sums(rs);
    const right = [sp.spend ? `지출 ${won(sp.spend)}원` : null, sp.income ? `수입 ${won(sp.income)}원` : null, (sp.savIn || sp.savOut) ? `저축 ${signedWon(sp.saving)}` : null].filter(Boolean).join(', ');
    return h('div', {},
      h('div', { class: 'ghead' }, h('span', {}, dateLabel(d, withYear)), h('span', {}, right)),
      h('div', { class: 'group' }, rs.map(itemRow)));
  });
}

function histBody() {
  const q = UI.query.trim().toLowerCase();
  if (q) {
    const digits = q.replace(/[,원\s]/g, '');
    const hits = S.records.filter(r =>
      (r.memo || '').toLowerCase().includes(q) ||
      catName(r.categoryId).toLowerCase().includes(q) ||
      methodName(r.methodId).toLowerCase().includes(q) ||
      (/^\d+$/.test(digits) && String(r.amount).includes(digits)));
    if (!hits.length) return h('div', { class: 'empty' }, h('strong', {}, '찾는 기록이 없어요'), '다른 단어로 검색해 보세요.');
    const sp = sums(hits);
    return h('div', {},
      h('p', { class: 'gfoot' }, `${hits.length}건, 지출 ${won(sp.spend)}원, 수입 ${won(sp.income)}원, 저축 ${signedWon(sp.saving)}`),
      groupedList(hits, true));
  }
  const modeSeg = h('div', { class: 'seg', role: 'group', 'aria-label': '보기 방식' },
    ...[['list', '목록'], ['cal', '달력']].map(([m, label]) => h('button', {
      'aria-pressed': String(UI.histMode === m), onclick: () => { UI.histMode = m; render(); }
    }, label)));
  const recs = monthRecords(UI.month);
  if (UI.histMode === 'cal') return h('div', {}, modeSeg, calendar(recs));
  if (!recs.length) return h('div', {}, modeSeg, h('div', { class: 'empty' }, h('strong', {}, '이 달에는 기록이 없어요'), '입력 탭에서 첫 기록을 남겨 보세요.'));
  return h('div', {}, modeSeg, groupedList(recs));
}

function calendar(recs) {
  const [y, m] = UI.month.split('-').map(Number);
  const first = new Date(y, m - 1, 1).getDay();
  const n = daysIn(y, m);
  const t = today();
  const spendByDay = new Map();
  for (const r of recs) {
    if (r.type === 'expense' && !isSaving(r)) spendByDay.set(r.date, (spendByDay.get(r.date) || 0) + r.amount);
  }
  // 앱을 쓰기 시작한 날(가장 이른 기록 또는 첫 실행일) 이전은 무지출로 세지 않음
  const firstRec = S.records.length ? S.records[S.records.length - 1].date : null;
  const firstUse = ymd(new Date(S.settings.firstUse));
  const startDay = firstRec && firstRec < firstUse ? firstRec : firstUse;
  let noSpend = 0;
  const cells = [];
  for (let i = 0; i < first; i++) cells.push(h('div', { class: 'cell blank', 'aria-hidden': 'true' }));
  for (let d = 1; d <= n; d++) {
    const ds = `${UI.month}-${pad(d)}`;
    const sp = spendByDay.get(ds) || 0;
    const past = ds <= t && ds >= startDay;
    const ns = past && !sp;
    if (ns) noSpend++;
    cells.push(h('button', {
      class: 'cell' + (ds > t ? ' future' : '') + (ds === t ? ' today' : '') + (UI.selDay === ds ? ' sel' : ''),
      'aria-label': `${d}일, ${sp ? '지출 ' + won(sp) + '원' : ns ? '무지출' : '기록 없음'}`,
      'aria-pressed': String(UI.selDay === ds),
      onclick: () => { UI.selDay = UI.selDay === ds ? null : ds; render(); }
    },
      h('span', { class: 'n' }, d),
      sp ? h('span', { class: 'v' }, compact(sp)) : ns ? h('span', { class: 'v zero' }, '0') : h('span', { class: 'v' }, ' ')));
  }
  const selRecs = UI.selDay ? recs.filter(r => r.date === UI.selDay) : [];
  return h('div', {},
    h('div', { class: 'group calwrap', style: 'margin-top:var(--space-md)' },
      h('div', { class: 'calhead', 'aria-hidden': 'true' }, DOW.map((d, i) => h('span', { class: i === 0 ? 'sun' : null }, d))),
      h('div', { class: 'cal' }, cells)),
    h('p', { class: 'gfoot' }, `무지출 ${noSpend}일. 초록 0은 아무것도 안 쓴 날이에요.`),
    UI.selDay ? (selRecs.length ? groupedList(selRecs) : h('div', { class: 'empty' }, `${dateLabel(UI.selDay)}에는 기록이 없어요.`)) : null);
}

/* ---------- 화면: 통계 ---------- */
function pctText(cur, prev) { if (!prev) return null; return Math.round((cur - prev) / prev * 100); }
function weekTotals(mk) {
  const [y, m] = mk.split('-').map(Number);
  const n = daysIn(y, m), weeks = Math.ceil(n / 7);
  const out = Array(weeks).fill(0);
  for (const r of monthRecords(mk)) if (r.type === 'expense' && !isSaving(r)) out[Math.min(weeks - 1, Math.floor((Number(r.date.slice(8)) - 1) / 7))] += r.amount;
  return out;
}
function viewStats() {
  const cur = monthRecords(UI.month);
  const prevMk = addMonth(UI.month, -1);
  const prev = monthRecords(prevMk);
  const s = sums(cur), p = sums(prev);
  const remain = s.income - s.spend - s.saving;
  const rateNum = s.income ? Math.round(s.saving / s.income * 100) : null;
  const m = Number(UI.month.slice(5)), pm = Number(prevMk.slice(5));

  // 소비 타일: 주별 막대
  const wk = weekTotals(UI.month), wmax = Math.max(1, ...wk);
  const nowWeek = monthKey(today()) === UI.month ? Math.floor((Number(today().slice(8)) - 1) / 7) : wk.length - 1;
  let trend;
  if (!prev.length) trend = `${pm}월 기록이 없어서 비교할 수 없어요`;
  else {
    const diff = s.spend - p.spend, pc = pctText(s.spend, p.spend);
    trend = diff === 0 ? h('span', {}, '지난달과 같아요')
      : h('span', {}, '지난달보다 ', h('b', { class: diff > 0 ? 'up' : 'down' }, `${pc != null ? Math.abs(pc) + '% ' : ''}${diff > 0 ? '더' : '덜'} 썼어요`));
  }
  const spendTile = h('div', { class: 'tile tt-pink' },
    h('div', { class: 'thead' }, h('span', { class: 'ttl' }, '이번 달 소비'), h('span', { class: 'meta' }, `${m}월`)),
    h('div', { class: 'tbody' },
      h('p', { class: 'fig' }, won(s.spend), h('small', {}, '원')),
      h('div', { class: 'weekbars', role: 'img', 'aria-label': '주별 소비: ' + wk.map((v, i) => `${i + 1}주 ${won(v)}원`).join(', ') },
        wk.map((v, i) => h('i', { class: i === nowWeek ? 'now' : null, style: `height:${Math.max(8, v / wmax * 100)}%` })))),
    h('p', { class: 'tnote' }, trend));

  // 저축 타일: 저축률 + 수입·저축·남은 돈
  const saveTile = h('div', { class: 'tile tt-indigo' },
    h('div', { class: 'thead' }, h('span', { class: 'ttl' }, '이번 달 저축'), h('span', { class: 'meta' }, rateNum == null ? '수입 기록 없음' : `저축률 ${rateNum}%`)),
    h('div', { class: 'tbody' },
      h('p', { class: 'fig' }, (s.saving < 0 ? '−' : '') + won(Math.abs(s.saving)), h('small', {}, '원')),
      h('div', { class: 'prog', role: 'img', 'aria-label': rateNum == null ? '저축률 계산 불가' : `저축률 ${rateNum}%` }, h('i', { style: `transform:scaleX(${Math.max(0, Math.min(1, (rateNum || 0) / 100))})` }))),
    h('div', { class: 'split' },
      h('div', {}, h('p', { class: 'k' }, '넣은 돈'), h('p', { class: 'v saving' }, won(s.savIn) + '원')),
      h('div', {}, h('p', { class: 'k' }, '꺼낸 돈'), h('p', { class: 'v' }, (s.savOut ? '−' : '') + won(s.savOut) + '원')),
      h('div', {}, h('p', { class: 'k' }, '수입'), h('p', { class: 'v income' }, won(s.income) + '원'))),
    h('p', { class: 'tnote' }, `남은 돈 ${signedWon(remain)} (수입 − 소비 − 저축)`));

  // 저축 계좌별: 이번 달 순저축 + (표시를 켠 계좌만) 이 달 말까지 넣은 돈 합계
  const monthEnd = UI.month + '-31';
  const monthSav = S.records.filter(r => isSaving(r) && monthKey(r.date) === UI.month);
  const accIds = new Set([...activeCats('saving').map(c => c.id), ...monthSav.map(r => r.categoryId)]);
  const accRows = [...accIds].map(id => ({ id, month: netSaving(monthSav.filter(r => r.categoryId === id)), total: accountTotal(id, monthEnd) }));
  const accTile = accRows.length ? h('div', { class: 'tile' },
    h('div', { class: 'thead' }, h('span', { class: 'ttl' }, '저축 계좌별'), h('span', { class: 'meta' }, accRows.some(a => a.total != null) ? `${m}월 말까지` : `${m}월`)),
    h('div', { class: 'catlist' }, accRows.map(a => h('div', { class: 'cmprow' }, mono(cat(a.id)),
      h('span', { class: 'nm' }, catName(a.id), a.total == null ? null : h('span', { class: 's' }, `지금까지 넣은 돈 ${signedWon(a.total)}`)),
      h('span', { class: 'diff' + (a.month > 0 ? ' save' : a.month === 0 ? ' none' : '') }, a.month ? (a.month > 0 ? '+' : '−') + won(Math.abs(a.month)) + '원' : '이번 달 없음'))))) : null;

  // 카테고리별 소비: 한 타일 안에 전부
  const cm = byCategory(cur);
  const sorted = [...cm].sort((a, b) => b[1] - a[1]);
  const max = sorted[0]?.[1] || 1;
  const catTile = h('div', { class: 'tile' },
    h('div', { class: 'thead' }, h('span', { class: 'ttl' }, '카테고리별 소비'), h('span', { class: 'meta' }, sorted.length ? `${sorted.length}개 카테고리` : '')),
    sorted.length
      ? h('div', { class: 'catlist' }, sorted.map(([id, v]) => {
          const c = cat(id);
          return h('div', { class: 'catrow' },
            h('div', { class: 'top' }, mono(c), h('span', { class: 'nm' }, catName(id)),
              h('span', { class: 'v' }, won(v) + '원', h('span', { class: 'pct' }, Math.round(v / s.spend * 100) + '%'))),
            h('div', { class: 'track', 'aria-hidden': 'true' }, h('div', { class: 'fill', style: `transform:scaleX(${Math.max(0.02, v / max)})` })));
        }))
      : h('p', { class: 'tnote' }, '이 달에는 소비 기록이 없어요. 입력 탭에서 기록하면 여기에 모여요.'));

  // 지난달 대비: 카테고리별 증감
  let cmpTile = null;
  if (prev.length) {
    const pmap = byCategory(prev);
    const ids = new Set([...cm.keys(), ...pmap.keys()]);
    const rows = [...ids].map(id => ({ id, c: cm.get(id) || 0, p: pmap.get(id) || 0 }))
      .sort((a, b) => Math.abs(b.c - b.p) - Math.abs(a.c - a.p))
      .map(({ id, c, p: pv }) => {
        let d, cls = '';
        if (!pv) { d = '새로 씀'; cls = 'up'; }
        else { const x = pctText(c, pv); d = (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x) + '%'; cls = x > 0 ? 'up' : x < 0 ? 'down' : ''; }
        return h('div', { class: 'cmprow' }, mono(cat(id)),
          h('span', { class: 'nm' }, catName(id), h('span', { class: 's' }, `${won(c)}원, 지난달 ${won(pv)}원`)),
          h('span', { class: 'diff ' + cls }, d));
      });
    cmpTile = h('div', { class: 'tile' },
      h('div', { class: 'thead' }, h('span', { class: 'ttl' }, `${pm}월과 비교`), h('span', { class: 'meta' }, `${pm}월 소비 ${won(p.spend)}원`)),
      h('div', { class: 'catlist' }, rows));
  }

  return h('section', {},
    monthNav(),
    spendTile, saveTile,
    h('p', { class: 'label', style: 'margin-top:var(--space-lg)' }, '자세히'),
    catTile, accTile, cmpTile);
}

/* ---------- 화면: 설정 ---------- */
function listEditor({ items, withMono, protectedFn, onAdd, onRename, onMove, onDelete }) {
  const nameIn = h('input', { class: 'field', name: 'new-name', autocomplete: 'off', placeholder: '새 이름', 'aria-label': '새 이름', maxlength: 20 });
  return h('div', { class: 'group' },
    items.map((it, i) => h('div', { class: 'row' + (withMono ? ' inset' : '') },
      withMono ? h('button', { class: 'ico', 'aria-label': `${it.name} 아이콘 바꾸기`, html: svgIcon(it.icon), onclick: () => pickIcon(it) }) : null,
      h('span', { class: 'grow' }, h('span', { class: 't' }, it.name), protectedFn(it) ? h('span', { class: 's' }, protectedFn(it)) : null),
      h('button', { class: 'mini', 'aria-label': `${it.name} 위로`, disabled: i === 0, onclick: () => onMove(it, -1) }, icon('up')),
      h('button', { class: 'mini', 'aria-label': `${it.name} 아래로`, disabled: i === items.length - 1, onclick: () => onMove(it, 1) }, icon('down')),
      h('button', { class: 'textbtn', 'aria-label': `${it.name} 이름 바꾸기`, onclick: () => onRename(it) }, '수정'),
      protectedFn(it) ? null : h('button', { class: 'textbtn danger', 'aria-label': `${it.name} 삭제`, onclick: () => onDelete(it) }, '삭제'))),
    h('div', { class: 'row' },
      h('span', { class: 'grow' }, nameIn),
      h('button', { class: 'textbtn', onclick: () => { const n = nameIn.value.trim(); if (!n) return nameIn.focus(); onAdd(n); } }, '추가')));
}

function moveIn(arr, it, dir, sameGroup) {
  const group = arr.filter(sameGroup);
  const i = group.indexOf(it), j = i + dir;
  if (j < 0 || j >= group.length) return;
  const a = arr.indexOf(group[i]), b = arr.indexOf(group[j]);
  [arr[a], arr[b]] = [arr[b], arr[a]];
}

function recurringSheet(rule, presetType) {
  const isNew = !rule;
  const t0 = presetType || 'expense';
  const f = rule ? { dir: 'in', ...rule } : { type: t0, amount: 0, categoryId: t0 === 'saving' ? defaultSavingAccount() : null, methodId: t0 === 'saving' ? null : defaultMethod(t0), dir: 'in', memo: '', day: new Date().getDate(), startDate: today() };
  let close;
  const form = recordForm(f, {
    recurring: true,
    submitLabel: isNew ? '반복 거래 추가' : '수정 저장',
    onSubmit: async f2 => {
      const data = { type: f2.type, amount: f2.amount, categoryId: f2.categoryId, methodId: f2.type === 'saving' ? null : f2.methodId, memo: (f2.memo || '').trim(), day: f2.day, startDate: f2.startDate, dir: f2.type === 'saving' ? (f2.dir || 'in') : undefined };
      if (isNew) S.settings.recurring.push({ id: uid(), ...data, lastRun: null, active: true });
      else {
        if (data.startDate < rule.startDate) rule.lastRun = null;
        Object.assign(rule, data);
      }
      const n = await runRecurring();
      close(); render();
      toast(n ? `저장했어요 (지난 ${n}건 추가)` : '저장했어요');
    },
    onDelete: isNew ? null : async () => {
      if (!confirm('이 반복 거래를 삭제할까요? 이미 추가된 기록은 남아 있어요.')) return;
      S.settings.recurring = S.settings.recurring.filter(r => r.id !== rule.id);
      await saveSettings(); close(); render(); toast('삭제했어요');
    }
  });
  close = openSheet(isNew ? '반복 거래 추가' : '반복 거래 수정', form);
}

// 저축 계좌별 '지금까지 넣은 돈': 표시 여부 + 앱 쓰기 전에 이미 넣은 돈
function totalSheet(c) {
  const f = { show: c.showTotal !== false, amount: c.base?.amount || 0, until: c.base?.until || addMonth(monthKey(today()), -1) };
  const months = [];
  for (let mk = monthKey(today()); mk >= '2023-01'; mk = addMonth(mk, -1)) months.push(mk);
  if (!months.includes(f.until)) months.push(f.until);
  const err = h('p', { class: 'err', role: 'alert' });
  const amountInput = h('input', {
    name: 'base-amount', inputmode: 'numeric', autocomplete: 'off', placeholder: '0', 'aria-label': '앱 쓰기 전에 넣은 돈',
    value: f.amount ? won(f.amount) : '',
    oninput: e => {
      err.textContent = '';
      const digits = e.target.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 12);
      f.amount = digits ? Number(digits) : 0;
      e.target.value = digits ? won(f.amount) : '';
      sizeAmount(e.target);
    }
  });
  sizeAmount(amountInput);
  const baseBlock = h('div', { hidden: !f.show },
    h('div', { class: 'tile amt-tile' },
      h('div', { class: 'thead' }, h('span', { class: 'ttl' }, '앱 쓰기 전에 넣은 돈'), h('span', { class: 'meta' }, '없으면 0')),
      h('label', { class: 'amount' }, amountInput, h('span', { class: 'won' }, '원'))),
    h('div', { class: 'group', style: 'margin-top:var(--space-sm)' },
      h('label', { class: 'row' }, h('span', { class: 'grow' }, '언제까지 넣은 돈'),
        h('select', { class: 'pill-date', name: 'base-until', 'aria-label': '언제까지 넣은 돈', onchange: e => { f.until = e.target.value; } },
          months.map(mk => h('option', { value: mk, selected: mk === f.until }, monthLabel(mk) + '까지'))))),
    h('p', { class: 'gfoot' }, '"지금까지 넣은 돈"이 이 금액에서 시작해요. 고른 달까지 앱에 적은 이 계좌 기록은 이 금액에 들어 있는 것으로 보고 다시 더하지 않아요.'));
  let close;
  const body = h('div', { class: 'form', 'data-type': 'saving' },
    h('div', { class: 'group', style: 'margin-top:var(--space-sm)' },
      h('label', { class: 'row' }, h('span', { class: 'grow' }, '통계에 지금까지 넣은 돈 표시'),
        h('input', { type: 'checkbox', role: 'switch', class: 'switch', name: 'show-total', checked: f.show,
          onchange: e => { f.show = e.target.checked; baseBlock.hidden = !f.show; } }))),
    h('p', { class: 'gfoot' }, '부모님 돈처럼 내 돈이 아닌 돈이 섞이는 계좌는 꺼 두면 이번 달 증감만 보여요.'),
    baseBlock,
    err,
    h('div', { style: 'margin-top:var(--space-2xs)' },
      h('button', {
        class: 'btn', onclick: async () => {
          c.showTotal = f.show;
          if (f.show) { if (f.amount) c.base = { amount: f.amount, until: f.until }; else delete c.base; }
          await saveSettings(); close(); render(); toast('저장했어요');
        }
      }, '저장')));
  close = openSheet(`${c.name} 지금까지 넣은 돈`, body);
}

async function persist() { await saveSettings(); render(); }

function viewSettings() {
  const st = S.settings;
  const type = UI.settingsType;
  const typeSeg = h('div', { class: 'seg', role: 'group', 'aria-label': '편집할 구분' },
    ...[['expense', '지출'], ['income', '수입'], ['saving', '저축']].map(([t, label]) => h('button', {
      'aria-pressed': String(type === t), onclick: () => { UI.settingsType = t; render(); }
    }, label)));

  const catsEditor = listEditor({
    items: activeCats(type), withMono: true,
    protectedFn: c => c.special === 'saving' ? '소비 합계에서 제외' : c.special === 'etc' ? '삭제 불가' : null,
    onAdd: async name => { st.categories.push({ id: (type === 'saving' ? 's' : 'c') + uid().slice(0, 8), type, emoji: '', name, special: null, hidden: false, tint: type === 'saving' ? undefined : nextTint(type), icon: ICON_BY_NAME[name] || (type === 'saving' ? 'coins' : 'tag') }); await persist(); toast('추가했어요. 왼쪽 아이콘을 눌러 모양을 고를 수 있어요'); },

    onMove: async (c, d) => { moveIn(st.categories, c, d, x => x.type === type && !x.hidden); await persist(); },
    onDelete: async c => {
      if (type === 'saving' && activeCats('saving').length <= 1) { alert('저축 계좌는 하나 이상 남겨 두어야 해요.'); return; }
      const used = S.records.filter(r => r.categoryId === c.id).length;
      if (!confirm(used ? `'${c.name}'를 목록에서 숨길까요? 이미 적은 ${used}건은 그대로 '${c.name}'로 남아요.` : `'${c.name}'를 삭제할까요?`)) return;
      c.hidden = true; await persist();
    }
  });

  const methodsEditor = listEditor({
    items: activeMethods(type), withMono: false, protectedFn: () => null,
    onAdd: async name => { st.methods.push({ id: 'm' + uid().slice(0, 8), type, name, hidden: false }); await persist(); toast('추가했어요'); },
    onRename: async m => { const n = prompt('이름', m.name); if (n == null || !n.trim()) return; m.name = n.trim(); await persist(); },
    onMove: async (m, d) => { moveIn(st.methods, m, d, x => x.type === type && !x.hidden); await persist(); },
    onDelete: async m => {
      if (activeMethods(type).length <= 1) { alert('하나 이상은 남겨 두어야 해요.'); return; }
      if (!confirm(`'${m.name}'를 목록에서 숨길까요? 이미 적은 기록은 그대로 남아요.`)) return;
      m.hidden = true; await persist();
    }
  });

  const recList = h('div', { class: 'group' },
    st.recurring.map(r => h('button', { class: 'row inset', onclick: () => recurringSheet(r) },
      mono(cat(r.categoryId)),
      h('span', { class: 'grow' },
        h('span', { class: 't' }, `${catName(r.categoryId)} ${r.type === 'income' ? '+' : r.type === 'saving' && r.dir === 'out' ? '−' : ''}${won(r.amount)}원`),
        h('span', { class: 's' }, [`매월 ${r.day === 31 ? '말일' : r.day + '일'}`, TYPE_LABEL[r.type] + (r.type === 'saving' ? (r.dir === 'out' ? ' 꺼내기' : ' 넣기') : ''), methodName(r.methodId), r.memo].filter(Boolean).join(', '))),
      chev())),
    h('button', { class: 'row action', onclick: () => recurringSheet(null, type) }, '반복 거래 추가'));

  const rules = h('textarea', {
    class: 'field', name: 'rules', 'aria-label': '기록 기준', value: st.rules,
    onchange: async e => { st.rules = e.target.value; await saveSettings(); toast('기록 기준을 저장했어요'); }
  });

  const fileIn = h('input', { type: 'file', name: 'backup-file', accept: 'application/json,.json', style: 'display:none', onchange: e => importBackup(e.target.files[0]) });
  const info = h('p', { class: 'gfoot' }, `기록 ${S.records.length}건`);
  if (navigator.storage?.estimate) navigator.storage.estimate().then(es => {
    info.textContent = `기록 ${S.records.length}건, 사용 중인 저장공간 약 ${(es.usage / 1024 / 1024).toFixed(1)}MB`;
  });
  if (navigator.storage?.persisted) navigator.storage.persisted().then(p => {
    info.append(p ? ', 영구 저장 켜짐' : ', 영구 저장 꺼짐 (홈 화면 앱으로 쓰면 보통 유지돼요)');
  });

  return h('section', {},
    navbar('설정'),
    typeSeg,
    h('p', { class: 'label' }, type === 'expense' ? '지출 카테고리' : type === 'income' ? '수입 카테고리' : '저축 계좌'),
    catsEditor,
    type === 'saving' ? h('p', { class: 'gfoot' }, '파킹통장처럼 생활비로 꺼내 쓰는 계좌는 입력할 때 "꺼내서 생활비로"를 고르면 이번 달 저축에서 빠져요.') : null,
    type === 'saving' ? h('p', { class: 'label' }, '지금까지 넣은 돈') : null,
    type === 'saving' ? h('div', { class: 'group' },
      activeCats('saving').map(c => h('button', { class: 'row inset', onclick: () => totalSheet(c) },
        mono(c),
        h('span', { class: 'grow' }, h('span', { class: 't' }, c.name),
          h('span', { class: 's' }, c.showTotal === false ? '표시 안 함' : c.base ? `표시, ${monthLabel(c.base.until)}까지 ${won(c.base.amount)}원부터` : '표시, 앱 기록만')),
        chev()))) : null,
    type === 'saving' ? h('p', { class: 'gfoot' }, '통계의 "저축 계좌별"에 계좌마다 누적 금액을 보여 줄지, 앱 쓰기 전에 넣은 돈이 얼마인지 정해요.') : null,
    type === 'saving' ? null : h('p', { class: 'label' }, type === 'expense' ? '결제수단' : '입금처'),
    type === 'saving' ? null : methodsEditor,
    h('p', { class: 'label' }, '반복 거래'),
    recList,
    st.recurring.length ? null : h('p', { class: 'gfoot' }, '통신비, 용돈, 청년도약계좌 납입처럼 매달 같은 날 생기는 거래를 등록하면 앱을 열 때 자동으로 기록돼요.'),
    h('p', { class: 'label' }, '기록 기준'),
    h('div', { class: 'group' }, rules),
    h('p', { class: 'label' }, '백업'),
    h('div', { class: 'group' },
      h('button', { class: 'row action', onclick: exportBackup }, '백업 파일 내보내기'),
      h('button', { class: 'row action', onclick: () => fileIn.click() }, '백업 불러오기'),
      h('button', { class: 'row action', onclick: exportCSV }, 'CSV 내보내기')),
    h('p', { class: 'gfoot' },
      st.lastBackup ? `마지막 백업: ${dateLabel(ymd(new Date(st.lastBackup)), true)}` : '아직 백업한 적이 없어요. 폰을 바꾸거나 앱을 지우면 기록이 사라지니, 2주에 한 번은 백업해 주세요.'),
    fileIn,
    info);
}

/* ---------- 내보내기·불러오기 ---------- */
async function shareOrDownload(filename, text, mime) {
  const blob = new Blob([text], { type: mime });
  const file = new File([blob], filename, { type: mime });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: filename }); return true; }
    catch (e) { if (e.name === 'AbortError') return false; }
  }
  const a = h('a', { href: URL.createObjectURL(blob), download: filename });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  return true;
}
const stamp = () => today().replace(/-/g, '');

async function exportBackup() {
  const data = { app: 'gagyebu', version: 2, exportedAt: new Date().toISOString(), settings: S.settings, records: S.records };
  const ok = await shareOrDownload(`가계부-백업-${stamp()}.json`, JSON.stringify(data), 'application/json');
  if (!ok) return;
  S.settings.lastBackup = new Date().toISOString();
  await saveSettings(); render(); toast('백업 파일을 만들었어요. iCloud Drive에 저장해 두세요');
}

async function importBackup(file) {
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch { alert('백업 파일을 읽을 수 없어요. 이 앱에서 내보낸 .json 파일인지 확인해 주세요.'); return; }
  if (data?.app !== 'gagyebu' || !Array.isArray(data.records) || !data.settings?.categories) { alert('이 앱의 백업 파일이 아니에요.'); return; }
  if (!confirm(`지금 기록 ${S.records.length}건을 지우고 백업의 ${data.records.length}건으로 바꿀까요? (백업 날짜: ${dateLabel(ymd(new Date(data.exportedAt)), true)})`)) return;
  await dbReplaceAll(data.records);
  S.records = data.records; sortRecords();
  const prevBackup = S.settings.lastBackup;
  S.settings = { ...defaultSettings(), ...data.settings, installHintDismissed: S.settings.installHintDismissed };
  S.settings.lastBackup = [prevBackup, data.settings.lastBackup, data.exportedAt].filter(Boolean).sort().pop() || null;
  ensureTints();
  const mig = migrateSaving();
  if (mig.moved.length) await dbPutMany(mig.moved);
  ensureIcons();
  await saveSettings();
  UI.draft = null; render(); toast(`${data.records.length}건을 불러왔어요`);
}

function exportCSV() {
  const esc = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = [['날짜', '구분', '카테고리/저축 계좌', '결제수단/입금처', '금액', '메모', '반복']];
  [...S.records].sort((a, b) => a.date.localeCompare(b.date)).forEach(r => rows.push([
    r.date, r.type === 'income' ? '수입' : isSaving(r) ? (r.dir === 'out' ? '저축 꺼내기' : '저축 넣기') : '지출', catName(r.categoryId),
    methodName(r.methodId), r.amount, r.memo, r.recurringId ? 'O' : ''
  ]));
  shareOrDownload(`가계부-${stamp()}.csv`, '﻿' + rows.map(r => r.map(esc).join(',')).join('\n'), 'text/csv');
}

/* ---------- 시작 ---------- */
(async function start() {
  try {
    db = await openDB();
    const kv = await kvGet('settings');
    S.settings = kv?.value ?? defaultSettings();
    S.records = await dbAll(); sortRecords();
    const mig = migrateSaving();
    if (mig.moved.length) await dbPutMany(mig.moved);
    const tinted = ensureTints() | ensureIcons();
    if (!kv || tinted || mig.changed) await saveSettings();
    const n = await runRecurring();
    render();
    if (n) toast(`반복 거래 ${n}건을 기록했어요`);
    if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  } catch (e) {
    document.getElementById('view').replaceChildren(h('div', { class: 'empty' },
      h('strong', {}, '저장소를 열 수 없어요'),
      '개인정보 보호 모드에서는 기록을 저장할 수 없어요. 일반 모드로 열어 주세요. (' + (e?.message || e) + ')'));
  }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();

// 다른 날 다시 열었을 때 날짜·반복 거래 갱신
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !S.settings) return;
  let stale = false;
  if (UI.draft && UI.draft.date < today() && !UI.draft.amount) { UI.draft.date = today(); stale = true; }
  const n = await runRecurring();
  const sheetOpen = !!document.querySelector('.backdrop');
  if ((n || stale) && !sheetOpen) render();
  if (n) toast(`반복 거래 ${n}건을 기록했어요`);
});
</script>
